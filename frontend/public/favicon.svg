<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="fintrack-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Wallet Body Gradient -->
    <linearGradient id="fintrack-wallet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Card Accent Gradient -->
    <linearGradient id="fintrack-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect width="64" height="64" rx="16" fill="url(#fintrack-bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#334155" stroke-width="1" opacity="0.6"/>

  <!-- Card Tucked Inside Wallet -->
  <rect x="20" y="11" width="24" height="12" rx="3" fill="url(#fintrack-card)"/>
  <rect x="20" y="15" width="24" height="2" fill="#064e3b" opacity="0.8"/>

  <!-- Wallet Body -->
  <rect x="10" y="18" width="44" height="34" rx="7" fill="url(#fintrack-wallet)" stroke="#6366f1" stroke-width="1.8"/>

  <!-- Wallet Seam / Stitching Accent -->
  <path d="M 10 35 Q 26 38 42 35" fill="none" stroke="#4338ca" stroke-width="1.2" stroke-dasharray="2,2"/>

  <!-- Wallet Clasp & Snap Fastener -->
  <path d="M 40 28 h 13 a 4 4 0 0 1 4 4 v 3 a 4 4 0 0 1 -4 4 h -13 z" fill="#4338ca" stroke="#6366f1" stroke-width="1.5"/>
  <circle cx="49" cy="33.5" r="2.2" fill="#38bdf8"/>

  <!-- Currency Emblem: Rupee Symbol (₹) -->
  <g fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Upper horizontal bar -->
    <path d="M 21 26.5 H 32.5"/>
    <!-- Middle horizontal bar -->
    <path d="M 21 30.5 H 30.5"/>
    <!-- Stem and upper curved loop -->
    <path d="M 24.5 26.5 V 32.5 C 24.5 35 28.5 35 28.5 32.5 C 28.5 30 24.5 30 24.5 30"/>
    <!-- Lower diagonal leg -->
    <path d="M 26 34.5 L 31.5 42"/>
  </g>
</svg>
